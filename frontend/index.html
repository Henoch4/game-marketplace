<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loot Bazaar</title><meta name="description" content="In-game NFT item marketplace.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);overflow-x:hidden}
a{color:inherit}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.rv{opacity:0;transform:translateY(46px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
#toasts{position:fixed;right:16px;bottom:16px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;font-size:14px;animation:tin .35s ease both;border-left:6px solid var(--ac)}
.toast.err{border-left-color:#f33}.toast.ok{border-left-color:#2c6}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;padding:28px 16px;font-size:13px;position:relative;z-index:2}
footer a{text-decoration:underline}
@media(prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none}*{animation:none!important}}

:root{--motion-fast:200ms;--motion-base:600ms;--motion-slow:1100ms;--bg:#ff7a1a;--fg:#1a1033;--ac:#fff2c4;--mut:#4a2a10;--ink:#1a1033}
body{font-family:'Space Grotesk',sans-serif;background-image:linear-gradient(#0000000d 1px,transparent 1px),linear-gradient(90deg,#0000000d 1px,transparent 1px);background-size:32px 32px}
.px{font-family:'Press Start 2P',monospace}
.bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--ink);color:var(--ac);flex-wrap:wrap;gap:8px}
.brand{font:12px 'Press Start 2P';text-decoration:none}
.barr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.badge{background:var(--ac);color:var(--ink);padding:5px 9px;font:8px 'Press Start 2P'}
select{background:var(--ink);color:var(--ac);border:2px solid var(--ac);padding:6px;font:inherit}
.wallet-btn,.go{background:var(--ac);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font:10px 'Press Start 2P';cursor:pointer;transition:transform .1s,box-shadow .1s}
.bar .wallet-btn{border-color:var(--ac);box-shadow:4px 4px 0 #ff7a1a}
.wallet-btn:active,.go:active{transform:translate(4px,4px);box-shadow:none}
.hero{padding:70px 16px 50px;position:relative;overflow:hidden}
.hero h1{font:clamp(34px,10vw,150px)/1.05 'Press Start 2P';color:var(--ink);text-shadow:6px 6px 0 var(--ac);max-width:12ch}
.hero h1 span{display:inline-block;animation:bob 1.6s steps(2) infinite}.hero h1 span:nth-child(2n){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-8px)}}
.launch{margin-top:34px;display:inline-block;background:var(--ink);color:var(--ac);padding:14px 18px;font:10px/1.6 'Press Start 2P';transform:rotate(-2deg);box-shadow:6px 6px 0 var(--ac)}
.coins{position:absolute;right:4vw;top:90px;display:grid;grid-auto-flow:dense;grid-template-columns:repeat(8,clamp(10px,2vw,22px));gap:0;opacity:.95}
.coins i{aspect-ratio:1}
.tick{background:var(--ink);color:var(--ac);overflow:hidden;white-space:nowrap;font:12px 'Press Start 2P';padding:14px 0;border-block:4px solid var(--ac)}
.tick div{display:inline-block;animation:mq 30s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.stalls{padding:60px 16px 20px}.stalls h2,.desk h2{font:clamp(18px,3vw,34px) 'Press Start 2P'color:var(--ink);margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px}
.item{background:var(--ac);border:4px solid var(--ink);padding:14px;box-shadow:8px 8px 0 var(--ink);position:relative;transition:transform .15s;cursor:pointer}
.item:nth-child(3n+2){margin-top:30px}.item:nth-child(3n){margin-top:12px;transform:rotate(1deg)}
.item:hover{transform:translate(-4px,-6px) rotate(-1.5deg)}
.item.sold{filter:grayscale(1);opacity:.55}
.sprite{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;background:#fff;border:3px solid var(--ink);image-rendering:pixelated;margin-bottom:12px}
.item .t{font:9px/1.5 'Press Start 2P'}.item .p{font:700 20px 'Space Grotesk';margin-top:8px}
.tag{position:absolute;top:-14px;right:-10px;background:var(--ink);color:var(--ac);padding:5px 8px;font:8px 'Press Start 2P'}
.desk{padding:60px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px;background:var(--ink);color:var(--ac)}
.desk h2{color:var(--ac);grid-column:1/-1}
.desk form{border:3px dashed var(--ac);padding:20px;display:flex;flex-direction:column;gap:10px}
.desk h3{font:12px 'Press Start 2P'}.desk label{font-size:12px;opacity:.8}
.desk input{background:#fff;color:var(--ink);border:3px solid var(--ac);padding:10px;font:inherit}
.desk .go{margin-top:8px}.desk .go{box-shadow:4px 4px 0 #ff7a1a}
.out{display:none;font:12px ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;background:#0006;padding:10px}.out.show{display:block}
footer{background:var(--ink);color:var(--ac)}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc,currentColor);outline-offset:2px}</style><link href="./product.css" rel="stylesheet"><script defer src="./vendor/ethers.umd.min.js"></script><script defer src="./product.js"></script></head><body id="top" class="suite-product su-split"><div class="suite-nav" role="navigation" aria-label="Main navigation"><a class="suite-brand" href="#top">Loot Bazaar</a><span id="suite-network" role="status">Checking mainnet…</span><button id="suite-wallet" type="button" disabled>Connect wallet</button><button id="suite-disconnect" type="button" hidden>Disconnect</button><a href="#suite-workspace">Open app</a></div>
<section class="hero"><div class="coins"></div>
<h1 class="rv"><span>LIST.</span> <span>BUY.</span> <span>LOOT.</span></h1>
<p class="launch rv">Contract deployed on BOT Chain</p></section><main class="suite-workspace suite-layout-4" id="suite-workspace"><p id="suite-message" role="status" aria-live="polite">Checking BOT Chain mainnet…</p><h2 id="suite-heading">Loot Bazaar</h2><p id="suite-summary"></p><div id="suite-address"></div>
<section id="suite-overview" aria-labelledby="suite-overview-heading"><h2 id="suite-overview-heading">On-chain overview</h2><div class="suite-grid" id="suite-stats"></div><button type="button" id="suite-refresh">Refresh mainnet data</button></section>
<section id="suite-actions" aria-labelledby="suite-actions-heading"><h2 id="suite-actions-heading">Your next move</h2><p id="suite-actions-note"></p><div class="suite-grid" id="suite-action-grid"></div></section>
<section aria-labelledby="suite-history-heading"><h2 id="suite-history-heading">Your session activity</h2><div id="suite-history"></div></section></main>
<dialog id="suite-review" class="suite-review" aria-labelledby="suite-review-title"><div id="suite-review-content"></div><div class="suite-review-actions"><button type="button" id="suite-confirm">Confirm in wallet</button><button type="button" id="suite-review-cancel">Cancel</button></div></dialog><footer class="suite-footer"><span>Loot Bazaar · BOT Chain mainnet 677</span><a rel="noopener noreferrer" target="_blank" href="https://botchain.ai">BOT Chain Website</a><a rel="noopener noreferrer" target="_blank" href="https://scan.botchain.ai/">BOTScan Explorer</a></footer></body></html>
